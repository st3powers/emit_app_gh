<!-- frontend/index.html -->
<!DOCTYPE html><html><head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin:0; display:flex; height:100vh; font-family:sans-serif; }
    #map { flex:2; } #panel { flex:1; padding:10px; overflow-y:auto; }
    .chart { width:100%; height:260px; }
    /* Capped so two charts stay on screen with a long scene list. */
    #sceneList { max-height:30vh; overflow-y:auto; border:1px solid #eee; }
    .scene-item { cursor:pointer; padding:4px; border-bottom:1px solid #ddd; font-size:13px; }
    .scene-item:hover { background:#eef; }
    #status { font-size:12px; padding:6px 2px; color:#555; min-height:1.2em; }
    #status.error { color:#b00020; }
    #overlayCtl { display:block; font-size:13px; padding:4px 2px 8px; user-select:none; }
    #overlayCtl input { vertical-align:middle; margin-right:5px; }
    #opacityCtl { font-size:12px; color:#555; padding:0 2px 8px; }
    #opacityCtl input { vertical-align:middle; width:120px; }
  </style>
</head><body>
  <div id="map"></div>
  <div id="panel">
    <button id="searchBtn">Search EMIT scenes in view</button>
    <div id="status"></div>

    <label id="overlayCtl" hidden>
      <input type="checkbox" id="overlayToggle" checked>
      Show EMIT raster
    </label>
    <div id="opacityCtl" hidden>
      Opacity <input type="range" id="overlayOpacity" min="0" max="100" value="90">
      <span id="opacityVal">90%</span>
    </div>

    <div id="sceneList"></div>
    <div id="chartFull" class="chart"></div>
    <div id="chartVnir" class="chart"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="app.js"></script>
</body></html>
